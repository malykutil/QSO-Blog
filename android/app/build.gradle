import java.util.Properties

apply plugin: "com.android.application"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def configValue = { String name, String fallback = "" ->
    return System.getenv(name) ?: localProperties.getProperty(name) ?: fallback
}

def javaString = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace "cz.ok2mkj.solar"
    compileSdk 36

    defaultConfig {
        applicationId "cz.ok2mkj.solar"
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName "2.7"

        buildConfigField "String", "SOLAR_BASE_URL", javaString(configValue("SOLAR_BASE_URL", "https://ok2mkj.vercel.app"))
        buildConfigField "String", "SOLAR_USERNAME", javaString(configValue("SOLAR_USERNAME"))
        buildConfigField "String", "SOLAR_PASSWORD", javaString(configValue("SOLAR_PASSWORD"))
    }

    buildFeatures {
        buildConfig true
    }
}
