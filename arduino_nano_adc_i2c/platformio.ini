[platformio]
src_dir = .

[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit INA219@^1.2.3
  adafruit/DHT sensor library@^1.4.6

; Instalované Nano používá starý bootloader (upload 57600 baud).
; Port lze případně nastavit ručně, např. upload_port = COM5.
